<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B7BE8">
<meta name="description" content="뀨뀨 미션 수행 대작전! 아이의 매일 미션 체크리스트와 코인 보상, 현금 사용까지 한 곳에서.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="뀨뀨 미션">
<title>뀨뀨 미션 수행 대작전! · 매일 미션 체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 15 C69 15 81 30 81 51 C81 71 67 84 50 84 C33 84 19 71 19 51 C19 30 31 15 50 15Z' fill='%23FF9384'/%3E%3Cpath d='M50 15 C49 8.5 55 5.5 60.2 7.6' fill='none' stroke='%23FF9384' stroke-width='3.4' stroke-linecap='round'/%3E%3Ccircle cx='61.8' cy='7.8' r='4.4' fill='%23B9A5F5'/%3E%3Ccircle cx='36' cy='50' r='6.4' fill='%234A3550'/%3E%3Ccircle cx='64' cy='50' r='6.4' fill='%234A3550'/%3E%3Ccircle cx='38.6' cy='47.2' r='2.2' fill='%23FFF'/%3E%3Ccircle cx='66.6' cy='47.2' r='2.2' fill='%23FFF'/%3E%3Cellipse cx='25.5' cy='60' rx='5.8' ry='4' fill='%23FFB3C1'/%3E%3Cellipse cx='74.5' cy='60' rx='5.8' ry='4' fill='%23FFB3C1'/%3E%3Cpath d='M44 60.5 Q50 67 56 60.5' fill='none' stroke='%234A3550' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#43395E; --muted:#9189B0; --line:#EDE9FA;
  --primary:#7C6CE0; --primary-2:#6A59D4; --mint:#1FA98B; --mint-2:#2FBF9B;
  --lav:#F2EEFE;
  --shadow:0 12px 28px -16px rgba(110,94,200,.5);
  --shadow-sm:0 4px 14px -8px rgba(110,94,200,.5);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; color:var(--ink);
  font-family:'Gowun Dodum',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 420px at 8% -8%, #EFE9FF 0%, rgba(239,233,255,0) 62%),
    radial-gradient(760px 380px at 100% 4%, #E1F8F0 0%, rgba(225,248,240,0) 58%),
    #FDFCFF;
  overscroll-behavior-y:contain;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
input{font:inherit}
.app{max-width:480px;margin:0 auto;padding:14px 16px 110px}

/* cute rounded display font for titles, buttons and badges */
.btitle,.card-h h2,.sheet h2,.chip,.btn,.tab,.wt,.star,.hero-num,.redeem-big .n,.addbtn,.wact,.q,.banner,.dcell .dw
  {font-family:'Jua','Gowun Dodum',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:400}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;flex:0 0 auto;border-radius:16px;overflow:hidden;
  background:linear-gradient(150deg,#F4F0FF,#E2F8F1);border:1.5px solid #EFEAFB;
  box-shadow:0 8px 16px -8px rgba(140,120,230,.6)}
.logo svg{width:100%;height:100%;display:block}
.btitle{font-size:18px;letter-spacing:-.2px;line-height:1.2}
.bsub{font-size:12px;color:var(--muted);font-weight:650;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbtn{width:42px;height:42px;flex:0 0 auto;border-radius:14px;background:#fff;border:1px solid #EFEAFB;
  box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:18px}

/* hero : 뀨뀨's coin pouch */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:17px 20px 16px;color:#fff;margin-bottom:14px;
  background:linear-gradient(140deg,#A79AF5 0%,#7C6CE0 52%,#6A59D4 100%);
  box-shadow:0 18px 32px -16px rgba(108,92,196,.9)}
.hero::after{content:"";position:absolute;width:190px;height:190px;right:-62px;top:-96px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero::before{content:"";position:absolute;width:130px;height:130px;right:120px;bottom:-76px;border-radius:50%;background:rgba(255,255,255,.11)}
.hero-kkyu{position:absolute;right:4px;bottom:-8px;width:96px;height:96px;filter:drop-shadow(0 6px 10px rgba(50,35,110,.28))}
.hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:750;letter-spacing:.1px}
.hero-krw{font-size:12.5px;font-weight:850;background:rgba(255,255,255,.24);padding:4px 10px;border-radius:999px;white-space:nowrap}
.hero-num{position:relative;font-size:46px;letter-spacing:-1px;line-height:1.02;margin:5px 0 1px;font-variant-numeric:tabular-nums}
.hero-num .unit{font-size:15px;font-weight:800;letter-spacing:0;margin-left:5px;opacity:.92}
.hero-bar{position:relative;height:9px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin:11px 0 7px;margin-right:84px}
.hero-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9F7E6,#6FE6C4);transition:width .55s cubic-bezier(.2,.9,.3,1)}
.hero-cap{position:relative;font-size:12px;font-weight:750;opacity:.96;margin-right:84px}

/* cards */
.card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:17px;letter-spacing:-.2px}
.sub{font-size:12.5px;color:var(--muted);font-weight:650;margin-top:2px}
.chip{flex:0 0 auto;font-size:13px;color:var(--primary-2);background:var(--lav);border-radius:999px;
  padding:8px 12px;min-height:34px;display:inline-flex;align-items:center;gap:4px}
.chip.plain{color:#7E7396;background:#F5F2FA}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:2px 0 13px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 6px;border-radius:14px;
  background:#FBFAFF;border:1.5px solid #EFEAF9;min-height:56px;transition:.18s}
.dcell .dw{font-size:10.5px;color:#A79DC4}
.dcell .dc{font-size:15px;line-height:19px;height:19px;min-height:19px}
.dcell.on{border-color:#C9BDF6;background:#F1EDFE;box-shadow:0 5px 12px -6px rgba(140,120,230,.8)}
.dcell.on .dw{color:var(--primary-2)}
.dcell.got{background:#EBFAF5;border-color:#C9EEDF}
.dcell.got .dw{color:#2FBF9B}
.dcell.future{opacity:.42}

/* mission rows */
.missions{display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border-radius:18px;
  background:#fff;border:1.5px solid #EFEAF9;box-shadow:0 3px 10px -6px rgba(110,94,200,.5);transition:transform .12s,background .18s}
.mrow:active{transform:scale(.985)}
.chk{width:42px;height:42px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:900;
  color:#fff;background:#FBFAFF;border:2px dashed #DFD7F2;transition:all .18s}
.mtext{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.memoji{font-size:19px;line-height:1;flex:0 0 auto}
.mtitle{font-size:15.5px;font-weight:750;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.done{background:#F2FCF8;border-color:#D2EFE3}
.mrow.done .chk{background:linear-gradient(150deg,#63D6B4,#2FBF9B);border:2px solid transparent;box-shadow:0 7px 14px -6px rgba(47,191,155,.85)}
.mrow.done .mtitle{color:#8FA8A0;text-decoration:line-through;text-decoration-thickness:1.5px}

/* banners */
.banner{display:flex;align-items:center;gap:9px;margin-top:12px;padding:12px 14px;border-radius:16px;
  font-size:13px;background:#F3F0FE;color:#6555C7;line-height:1.35}
.banner.ok{background:#EFFBF5;color:#1F9E7C}
.banner.sun{background:linear-gradient(120deg,#F3EDFF,#E9E1FD);color:#6555C7;box-shadow:inset 0 0 0 1.5px #D9CDF8}

/* stars */
.stars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:11px}
.star{aspect-ratio:1/1;border-radius:15px;display:grid;place-items:center;font-size:16px;
  background:#FBFAFF;border:1.5px dashed #E5DEF4;color:#C9C0E2}
.star.on{background:linear-gradient(150deg,#FFE79B,#FFC24D);border:1.5px solid #FFD470;color:#9A6A12;
  box-shadow:0 8px 14px -8px rgba(255,194,77,1)}

/* week rows */
.wrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:16px;background:#FCFBFF;
  border:1.5px solid #F1ECFA;margin-bottom:8px}
.wbadge{width:34px;height:34px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;font-size:13px;
  background:var(--lav);color:#6A59D4}
.wbadge.sun{color:#E05555;background:#FFEEEE}
.wbadge.sat{color:#4B7BD6;background:#EDF4FF}
.wmain{flex:1;min-width:0}
.wt{font-size:14px;letter-spacing:-.2px}
.ws{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:1px}
.wact{flex:0 0 auto;font-size:12px;color:var(--primary-2);background:var(--lav);border-radius:999px;padding:7px 11px;min-height:32px}
.wact.lock{color:#B4AACB;background:#F5F3FA}
.wrow.today{background:#F8F6FF;border-color:#DCD2F8;box-shadow:0 6px 16px -12px rgba(108,92,196,.9)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;
  font-size:16.5px;letter-spacing:0;color:#fff;
  background:linear-gradient(140deg,#9A8BF2,#6A59D4);box-shadow:0 14px 24px -12px rgba(106,89,212,1);transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#F1EDFE;color:var(--primary-2);box-shadow:none}
.btn.mint{background:linear-gradient(140deg,#5FD3B2,#22B592);box-shadow:0 14px 24px -12px rgba(34,181,146,1)}
.btn.soft{background:#F4F2F9;color:#6E6396;box-shadow:none}
.btn[disabled]{opacity:.45;box-shadow:none;pointer-events:none}
.btn.sm{min-height:44px;font-size:14px;border-radius:14px}

/* segmented */
.seg{display:flex;gap:5px;background:#F1EDFB;padding:5px;border-radius:16px;margin-bottom:14px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-size:12.5px;font-weight:800;color:#A79DC4;min-height:42px}
.seg button.on{background:#fff;color:var(--primary-2);box-shadow:0 3px 8px -2px rgba(110,94,200,.35)}

/* plan : day-of-week selector */
.pdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:2px 0 12px}
.pday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:13px;
  background:#FBFAFF;border:1.5px solid #EFEAF9;transition:.15s}
.pday .dw{font-family:'Jua','Gowun Dodum',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:400;font-size:12.5px;color:#A79DC4}
.pday .dw.sun{color:#E05555}.pday .dw.sat{color:#4B7BD6}
.pday .dc{font-size:9.5px;color:#C0B7D8;font-weight:800;font-variant-numeric:tabular-nums}
.pday .cnt{font-size:10px;font-weight:900;min-width:17px;padding:0 4px;border-radius:9px;background:#F1EDFB;color:#C9C0E2;line-height:15px;font-variant-numeric:tabular-nums}
.pday .cnt.has{background:var(--lav);color:var(--primary-2)}
.pday.on{border-color:#C9BDF6;background:#F1EDFE;box-shadow:0 5px 12px -6px rgba(140,120,230,.8)}
.pday.on .dw{color:var(--primary-2)}
.pday:active{transform:scale(.96)}

/* inputs */
.input{width:100%;min-height:52px;border-radius:16px;border:1.5px solid #E4DDF6;background:#FCFBFF;
  padding:0 14px;font-size:15.5px;font-weight:700;color:var(--ink);outline:none;transition:.15s}
.input::placeholder{color:#C0B7D8;font-weight:650}
.input:focus{border-color:#B9A5F5;background:#fff;box-shadow:0 0 0 4px rgba(160,140,240,.18)}
.lbl{font-size:12px;font-weight:850;color:#A79DC4;letter-spacing:.2px;margin:0 2px 7px}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;gap:4px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:50;
  background:rgba(253,252,255,.94);backdrop-filter:blur(16px) saturate(1.2);border-top:1px solid #EFEAF9}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border-radius:16px;
  font-size:11px;color:#B0A7C8;min-height:52px;justify-content:center}
.tab .i{font-size:19px;line-height:1;filter:grayscale(.55);opacity:.85}
.tab.on{color:var(--primary-2);background:#F1EDFE}
.tab.on .i{filter:none;opacity:1}

/* toast */
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,16px);z-index:90;max-width:86vw;
  background:rgba(58,48,92,.95);color:#fff;padding:12px 18px;border-radius:16px;font-size:13.5px;font-weight:750;
  text-align:center;opacity:0;pointer-events:none;transition:.24s;line-height:1.35}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* confetti */
.spark{position:fixed;z-index:80;font-size:22px;pointer-events:none;animation:spark 950ms ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.5);opacity:0}18%{opacity:1}
100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}

/* sheet */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(66,54,104,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;background:#FFFEFF;border-radius:26px 26px 0 0;padding:6px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:90dvh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.9,.3,1);box-shadow:0 -12px 40px rgba(90,70,150,.25)}
.grab{width:44px;height:5px;border-radius:99px;background:#E4DEF4;margin:6px auto 12px}
.sheet h2{font-size:19px;letter-spacing:-.3px}
.sheet .sub{margin-bottom:14px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* plan list */
.plist{display:flex;flex-direction:column;gap:7px;margin:12px 0 4px}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 12px;border-radius:15px;background:#FCFBFF;border:1.5px solid #F1ECFA}
.pitem .pt{flex:1;font-size:14.5px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;font-size:15px;color:#AFA5C8;background:#F5F2FA}
.emos{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.emos::-webkit-scrollbar{display:none}
.emo{width:40px;height:40px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;font-size:19px;background:#FBFAFF;border:1.5px solid #EFEAF9}
.emo.on{border-color:#C9BDF6;background:#F1EDFE;box-shadow:0 4px 10px -6px rgba(140,120,230,.9)}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.q{font-size:12.5px;padding:8px 11px;border-radius:999px;background:#F5F3FA;color:#6E6396;min-height:34px;display:inline-flex;align-items:center;gap:5px}
.q:active{background:#EDE8FB}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .input{flex:1;min-width:0}
.addbtn{width:56px;flex:0 0 auto;border-radius:16px;background:linear-gradient(140deg,#9A8BF2,#6A59D4);color:#fff;font-size:22px;
  box-shadow:0 10px 18px -10px rgba(106,89,212,1);display:grid;place-items:center}

/* history */
.hgroup{margin-bottom:13px}
.hdate{font-size:11.5px;font-weight:850;color:#A79DC4;letter-spacing:.2px;margin:0 3px 7px}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#FCFBFF;border:1px solid #F1ECFA;border-radius:14px;margin-bottom:6px}
.hmain{flex:1;min-width:0}
.hlabel{font-size:14px;font-weight:750}
.htime{font-size:11px;color:#B0A7C8;font-weight:700;margin-top:1px}
.hamt{font-size:14.5px;font-weight:900;color:var(--mint-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hamt.minus{color:var(--primary-2)}

/* misc */
.empty{text-align:center;padding:22px 8px 10px}
.empty .kk{width:84px;height:84px;margin:0 auto}
.empty p{font-size:13.5px;color:var(--muted);font-weight:700;margin:9px 0 15px}
.note{font-size:11.5px;color:#A79FBF;font-weight:650;line-height:1.5;margin-top:10px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:#FCFBFF;border:1px solid #F1ECFA;margin-bottom:8px}
.kv .k{font-size:13.5px;font-weight:750}
.kv .v{font-size:13.5px;font-weight:850;color:var(--primary-2)}
.divider{height:1px;background:#F1ECFA;margin:14px 0}
.tip{background:#F3F0FE;border-radius:16px;padding:12px 14px;font-size:12px;font-weight:700;color:#6555C7;line-height:1.55}
.tip b{font-weight:900}
.redeem-big{text-align:center;padding:6px 0 2px}
.redeem-big .n{font-size:31px;letter-spacing:-.5px;color:var(--primary-2);font-variant-numeric:tabular-nums}
.redeem-big .w{font-size:13px;font-weight:800;color:var(--muted);margin-top:2px}
.qrow{display:flex;gap:7px;margin:12px 0}
.qrow .q{flex:1;justify-content:center;padding:11px 6px;font-size:12.5px;background:var(--lav);color:var(--primary-2)}
/* ---------- 초등 필수 영단어 800 ---------- */
.wbar{height:9px;border-radius:99px;background:#F1EDFB;overflow:hidden}
.wbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8FE7CE,#2FBF9B);transition:width .45s cubic-bezier(.2,.9,.3,1)}
.flash{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:186px;border-radius:22px;padding:26px 20px;cursor:pointer;text-align:center;
  background:linear-gradient(150deg,#F5F1FF 0%,#E9FBF4 100%);border:1.5px solid #E6DFF9;
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.55),0 12px 24px -18px rgba(110,94,200,.9);
  transition:transform .12s ease,background .2s}
.flash:active{transform:scale(.985)}
.flash-en{font-family:'Jua','Gowun Dodum',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:44px;
  line-height:1.08;letter-spacing:-.5px;color:#5B4BC0;word-break:break-word}
.flash-ko{font-family:'Jua','Gowun Dodum',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:30px;
  line-height:1.2;color:#12A183;word-break:keep-all}
.flash-sub{font-size:11.5px;font-weight:800;color:#A79DC4;letter-spacing:.2px}
.flash-mark{position:absolute;left:14px;top:12px;font-size:16px;line-height:1}
.spk{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:15px;background:#fff;border:1px solid #EFEAFB;
  box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:20px;z-index:2}
.spk:active{transform:scale(.94)}
.wnav{display:flex;align-items:center;gap:10px;margin-top:12px}
.wbtn{width:54px;height:46px;flex:0 0 auto;border-radius:14px;background:#F4F1FE;color:#6A59D4;display:grid;place-items:center;

<script>
(function(){
'use strict';

/* ========================================================================
   상수 · 날짜 도구
   ======================================================================== */
var STORE_KEY = 'kidMissionCoin.v1';
var COIN_WON  = 100;    // 코인 1개 = 100원
var REDEEM_MIN = 30;    // 30코인부터 현금처럼 사용 가능
var MAX_MISSIONS = 12;

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function isoOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function dateOf(iso){ var p = iso.split('-').map(Number); return new Date(p[0], p[1]-1, p[2], 12, 0, 0, 0); }
function addDays(iso, n){ var d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function mondayOf(iso){ var dow = dateOf(iso).getDay(); return addDays(iso, dow === 0 ? -6 : 1 - dow); }
function weekDates(mon){ var a = []; for (var i=0;i<7;i++) a.push(addDays(mon, i)); return a; }
var WD = ['일','월','화','수','목','금','토'];
function wdOf(iso){ return WD[dateOf(iso).getDay()]; }
function mdOf(iso){ var d = dateOf(iso); return (d.getMonth()+1) + '/' + d.getDate(); }
function longDate(iso){ var d = dateOf(iso); return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + wdOf(iso) + ')'; }
function won(n){ return Number(n).toLocaleString('ko-KR') + '원'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function num(n){ return Number(n).toLocaleString('ko-KR'); }

// 테스트용 날짜 오버라이드 (화면에는 드러나지 않음)
var __testDate = null;
function nowDate(){ return __testDate ? dateOf(__testDate) : new Date(); }
function todayISO(){ return isoOf(nowDate()); }
function stampNow(){ return new Date().toISOString(); }

/* ========================================================================
   상태 · 핵심 규칙 (Logic)
   ======================================================================== */
function emptyState(){
  return { v: 1, childName: '', weeks: {}, ledger: [], redemptions: [], createdAt: stampNow(),
           words: { start: '', days: {} } };
}

function migrate(o){
  if (!o || typeof o !== 'object') return emptyState();
  if (!o.weeks || typeof o.weeks !== 'object') o.weeks = {};
  if (!Array.isArray(o.ledger)) o.ledger = [];
  if (!Array.isArray(o.redemptions)) o.redemptions = [];
  if (typeof o.childName !== 'string') o.childName = '';
  // 영단어 학습 상태(없던 기록도 그대로 살린다 · 하위 호환)
  if (!o.words || typeof o.words !== 'object') o.words = {};
  if (typeof o.words.start !== 'string') o.words.start = '';
  if (!o.words.days || typeof o.words.days !== 'object' || Array.isArray(o.words.days)) o.words.days = {};
  o.v = 1;
  return o;
}

function ensureWeek(S, mon){
  if (!S.weeks[mon]) S.weeks[mon] = { missions: [], days: {}, bonus: false, plannedAt: null };
  var w = S.weeks[mon];
  if (!Array.isArray(w.missions)) w.missions = [];
  if (!w.days || typeof w.days !== 'object') w.days = {};
  if (!w.dayMissions || typeof w.dayMissions !== 'object' || Array.isArray(w.dayMissions)) w.dayMissions = {};
  var ds = weekDates(mon);
  for (var i = 0; i < ds.length; i++){
    var d = ds[i];
    if (!w.days[d]) w.days[d] = { done: {}, awarded: false };
    if (!w.days[d].done || typeof w.days[d].done !== 'object') w.days[d].done = {};
  }
  return w;
}

// 그날의 미션 목록(읽기 전용). 요일별 목록이 없으면 옛 방식(주 공통 missions)을 그대로 쓴다.
function dayList(w, date){
  if (w.dayMissions && Object.prototype.hasOwnProperty.call(w.dayMissions, date) && Array.isArray(w.dayMissions[date])){
    return w.dayMissions[date];
  }
  return w.missions;
}

// 그날 목록을 고치기 시작할 때 호출: 주 공통 목록을 그날 전용으로 복사해 놓고 나서 고친다.
function dayListRW(S, mon, date){
  var w = ensureWeek(S, mon);
  if (!w.dayMissions[date]){
    w.dayMissions[date] = w.missions.map(function(m){ return { id: m.id, title: m.title, emoji: m.emoji || '⭐' }; });
  }
  return w.dayMissions[date];
}

function weekHasMissions(w){
  if (w.missions && w.missions.length) return true;
  var dm = w.dayMissions || {};
  for (var k in dm) if (dm[k] && dm[k].length) return true;
  return false;
}

function dayStats(w, date){
  var day = w.days[date] || { done: {} };
  var list = dayList(w, date);
  var total = list.length;
  var done = 0;
  for (var i = 0; i < total; i++) if (day.done[list[i].id]) done++;
  return { total: total, done: done, complete: total > 0 && done === total };
}

var Logic = {
  balance: function(S){
    var b = 0;
    for (var i = 0; i < S.ledger.length; i++) b += S.ledger[i].amount;
    return b;
  },

  canRedeem: function(S){ return this.balance(S) >= REDEEM_MIN; },

  // 하루 미션을 모두 채웠으면 +1 (하루 한 번만). 주간 개근이면 +3 (주당 한 번만).
  tryAward: function(S, mon, date, today){
    var w = ensureWeek(S, mon);
    var day = w.days[date];
    if (!day || day.awarded) return null;
    if (date > today) return null;
    if (weekDates(mon).indexOf(date) < 0) return null;
    if (!dayStats(w, date).complete) return null;

    day.awarded = true;
    day.awardedAt = stampNow();
    S.ledger.push({ id: uid(), at: stampNow(), type: 'daily', amount: 1,
                    label: '하루 미션 완성', dateKey: date });

    var weekly = false;
    var all = weekDates(mon).every(function(d){ return w.days[d] && w.days[d].awarded; });
    if (all && !w.bonus && weekDates(mon).every(function(d){ return dayList(w, d).length > 0; })){
      w.bonus = true;
      w.bonusAt = stampNow();
      weekly = true;
      S.ledger.push({ id: uid(), at: stampNow(), type: 'weekly', amount: 3,
                      label: '일주일 개근 보너스', dateKey: weekDates(mon)[6] });
    }
    return { daily: true, weekly: weekly };
  },

  // 체크 토글. 이미 받은 코인은 되돌리지 않고, 다시 체크해도 중복 지급하지 않는다.
  toggle: function(S, date, mid, today){
    if (date > today) return null;
    var mon = mondayOf(date);
    var w = ensureWeek(S, mon);
    var exists = dayList(w, date).some(function(m){ return m.id === mid; });
    if (!exists) return null;
    var day = w.days[date];
    var wasAwarded = !!day.awarded;
    if (day.done[mid]) delete day.done[mid]; else day.done[mid] = true;
    var res = { checked: !!day.done[mid], daily: false, weekly: false, wasAwarded: wasAwarded };
    var a = this.tryAward(S, mon, date, today);
    if (a){ res.daily = a.daily; res.weekly = a.weekly; }
    return res;
  },

  addMission: function(S, mon, date, title, emoji){
    var w = ensureWeek(S, mon);
    var list = dayListRW(S, mon, date);
    var t = String(title || '').replace(/\s+/g, ' ').trim();
    if (!t) return { ok: false, msg: '미션 이름을 적어 주세요' };
    if (t.length > 20) t = t.slice(0, 20);
    if (list.length >= MAX_MISSIONS) return { ok: false, msg: '하루 미션은 ' + MAX_MISSIONS + '개까지 정할 수 있어요' };
    var dup = list.some(function(m){ return m.title === t; });
    if (dup) return { ok: false, msg: '그날 이미 있는 미션이에요' };
    list.push({ id: uid(), title: t, emoji: emoji || '⭐' });
    if (!w.plannedAt) w.plannedAt = stampNow();
    return { ok: true };
  },

  removeMission: function(S, mon, date, id, today){
    var w = ensureWeek(S, mon);
    var list = dayListRW(S, mon, date);
    var idx = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { idx = i; break; }
    if (idx < 0) return { ok: false };
    var removed = list.splice(idx, 1)[0];
    if (w.days[date] && w.days[date].done) delete w.days[date].done[id];
    // 미션을 빼서 그날 미션이 모두 채워졌다면 그날 몫을 지급
    var a = null;
    if (date === today) a = this.tryAward(S, mon, today, today);
    return { ok: true, removed: removed, award: a };
  },

  redeem: function(S, coins, today){
    coins = Math.floor(Number(coins));
    var bal = this.balance(S);
    if (bal < REDEEM_MIN) return { ok: false, msg: REDEEM_MIN + '코인부터 현금처럼 쓸 수 있어요' };
    if (!coins || coins < 1) return { ok: false, msg: '사용할 코인을 정해 주세요' };
    if (coins > bal) return { ok: false, msg: '가진 코인보다 많이 쓸 수 없어요' };
    S.ledger.push({ id: uid(), at: stampNow(), type: 'redeem', amount: -coins,
                    label: '현금으로 사용', dateKey: today });
    var rec = { id: uid(), at: stampNow(), coins: coins, won: coins * COIN_WON };
    S.redemptions.push(rec);
    return { ok: true, coins: coins, won: coins * COIN_WON, id: rec.id };
  },

  weekAwardedCount: function(S, mon){
    var w = ensureWeek(S, mon), n = 0;
    weekDates(mon).forEach(function(d){ if (w.days[d].awarded) n++; });
    return n;
  },

  weekCoinTotal: function(S, mon){
    var ds = weekDates(mon), total = 0;
    for (var i = 0; i < S.ledger.length; i++){
      var e = S.ledger[i];
      if (ds.indexOf(e.dateKey) >= 0 && (e.type === 'daily' || e.type === 'weekly' || e.type === 'words')) total += e.amount;
    }
    return total;
  }
};

/* ========================================================================
   저장
   ======================================================================== */
var S = load();
var view = 'today';          // today | week | wallet
var cursor = null;           // 오늘 보기에서 보고 있는 날짜
var sheet = null;            // plan | settings | redeem | null
var planWeek = null;         // 미션 정기 화면의 주(월요일)
var planDay = null;          // 미션 정기 화면에서 고른 날짜
var draft = '';              // 미션 입력 중인 글자
var draftEmoji = '⭐';
var redeemInput = null;      // 현금 사용 금액 입력값

function load(){
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyState();
    return migrate(JSON.parse(raw));
  } catch (e) { return emptyState(); }
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ========================================================================
   작은 UI 도구
   ======================================================================== */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2400);
}
function vibrate(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function fireConfetti(big){
  var emojis = big ? ['🎉','⭐','🪙','✨','💜','🪙','🎊','⭐'] : ['⭐','🪙','✨','💜'];
  var n = big ? 16 : 9;
  for (var i = 0; i < n; i++){
    (function(i){
      var s = document.createElement('div');
      s.className = 'spark';
      s.textContent = emojis[i % emojis.length];
      var x = window.innerWidth / 2 + (Math.random() - .5) * 150;
      var y = window.innerHeight * (big ? .42 : .52) + (Math.random() - .5) * 60;
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.setProperty('--dx', ((Math.random() - .5) * 240) + 'px');
      s.style.setProperty('--dy', (-120 - Math.random() * 180) + 'px');
      s.style.setProperty('--rot', ((Math.random() - .5) * 240) + 'deg');
      document.body.appendChild(s);
      setTimeout(function(){ s.remove(); }, 1000);
    })(i);
  }
}

/* ==========================================================================
   마스코트 캐릭터 "뀨뀨" — 순도 높은 우리 앱 전용 SVG 그림 (외부 이미지 없음)
   kind : 'face'(얼굴) · 'hero'(코인 든 뀨뀨) · 'cheer'(만세) · 'coin'(코인 안기)

function render(){
  var today = todayISO();

  // 커서를 이번 주 안으로 유지
  if (!cursor || mondayOf(cursor) !== mondayOf(today)) cursor = today;
  if (cursor > today) cursor = today;

  var name = (S.childName || '').trim();
  var bsub = document.getElementById('bsub');
  if (bsub) bsub.textContent = name ? name + '의 미션 · 매일 모두 끝내면 코인 1개!' : '뀨뀨와 매일 미션을 모두 끝내면 코인 1개!';

  var root = document.getElementById('view');
  if (root){
    if (view === 'today') root.innerHTML = viewToday(today);
    else if (view === 'week') root.innerHTML = viewWeek(today);
    else if (view === 'words') root.innerHTML = viewWords(today);
    else root.innerHTML = viewWallet(today);
  }
  renderTabs();
  renderSheet();
  save();

  // 영단어 퀴즈 입력칸 포커스 · 오답 흔들기
  if (view === 'words' && wmode === 'quiz'){
    var ansEl = document.getElementById('wans');
    if (ansEl){
      if (wfocus){
        try { ansEl.focus(); ansEl.setSelectionRange(ansEl.value.length, ansEl.value.length); } catch (e) {}
        wfocus = false;
      }
      if (wshake){
        ansEl.classList.add('shake');
        setTimeout(function(){ ansEl.classList.remove('shake'); }, 460);
        wshake = false;
      }
    }
  }
}

function renderTabs(){
  var el = document.getElementById('tabs');
  if (!el) return;
  var items = [
    { v: 'today',  i: '🏠', t: '오늘' },
    { v: 'words',  i: '📚', t: '영단어' },
    { v: 'week',   i: '🗓️', t: '이번 주' },
    { v: 'wallet', i: '🪙', t: '코인' }
  ];
  el.innerHTML = items.map(function(it){
    return '<button class="tab ' + (view === it.v ? 'on' : '') + '" data-act="tab" data-view="' + it.v + '"' +

  var pct = Math.min(100, Math.round(bal / REDEEM_MIN * 100));

  if (bal >= REDEEM_MIN) cap = '🎉 현금으로 바꿀 수 있어요!';
  else cap = (REDEEM_MIN - bal) + '코인 더 모으면 현금으로 바꿀 수 있어요';
  return '<section class="hero" aria-label="내 코인">' +
    '<div class="hero-kkyu" aria-hidden="true">' + kkyu('hero') + '</div>' +
    '<div class="hero-top"><span>🪙 내 코인</span><span class="hero-krw">' + won(bal * COIN_WON) + '</span></div>' +
    '<div class="hero-num">' + num(bal) + '<span class="unit">코인</span></div>' +
    '<div class="hero-bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="hero-cap">' + cap + '</div>' +

}

      '<p>아직 코인 내역이 없어요.<br>미션을 모두 체크하면 뀨뀨가 코인을 가져다줄 거예요!</p></div>';
  } else {
    var sorted = S.ledger.slice().sort(function(a, b){
      if (a.dateKey !== b.dateKey) return a.dateKey < b.dateKey ? 1 : -1;
      if (a.at === b.at) return 0;
      return a.at < b.at ? 1 : -1;
    });
    var groups = [], curKey = null;
    sorted.forEach(function(e){
      if (e.dateKey !== curKey){ curKey = e.dateKey; groups.push({ key: curKey, items: [] }); }
      groups[groups.length - 1].items.push(e);
    });
    out += groups.map(function(g){
      var rows = g.items.map(function(e){
        var t = '';
        try {
          var d = new Date(e.at);

          '<div class="hamt ' + (e.amount < 0 ? 'minus' : '') + '">' + sign + Math.abs(e.amount) + ' 코인</div></div>';
      }).join('');
      return '<div class="hgroup"><div class="hdate">' + (g.key ? longDate(g.key) : '') + '</div>' + rows + '</div>';
    }).join('');
  }
  out += '</section>';
  return out;
}

/* ========================================================================
   초등 필수 영단어 800 · 매일 5단어 학습
   ======================================================================== */
var WORDS_PER_DAY = 5;
var WORD_TOTAL_DAYS = 160;
var WORD_LIST = (typeof WORDS_800 !== 'undefined' && WORDS_800) ? WORDS_800.map(function(a){
  return { word: a[0], meaning: a[1], example: a[2], answer: a[3], hint: a[4], exampleKo: a[5] };
}) : [];

var HINT_TEXT = {
  base: '기본형 그대로 넣어요',
  an: '모음 소리 앞에는 an을 써요',
  plural: '여러 개(복수형)예요 — 끝에 -s / -es',
  plural_irr: '여러 개(복수형)인데 모양이 달라져요',
  third: '주어가 3인칭 단수예요 — 동사에 -s / -es',
  past: '동사 과거형이에요 — 끝에 -ed',
  past_irr: '과거형인데 모양이 달라져요 (불규칙 동사)',
  ing: '동사의 -ing 형태예요',
  comp: '~보다 더 (비교급) — -er',
  sup: '가장 ~ (최상급) — -est',
  cap: '첫 글자를 대문자로 써요'
};

var wmode = 'learn';      // learn | quiz | result
var wdate = null;         // 이 화면에서 공부하는 날짜(오늘 또는 복습할 날)
var wi = 0;               // 카드·문제 번호
var wflip = false;        // 카드가 뜻을 보여 주는 중인지
var wfeedback = null;     // { ok, msg }
var winput = '';          // 입력 중인 답
var wfocus = false;       // 렌더 후 입력칸에 포커스할지
var wshake = false;       // 오답 흔들기

function wordsReady(){ return WORD_LIST.length >= WORDS_PER_DAY; }

function ensureWordStart(){
  if (!S.words || typeof S.words !== 'object') S.words = { start: '', days: {} };
  if (!S.words.days || typeof S.words.days !== 'object' || Array.isArray(S.words.days)) S.words.days = {};
  if (!S.words.start) S.words.start = todayISO();
  return S.words.start;
}

function wDiff(a, b){ return Math.round((dateOf(a).getTime() - dateOf(b).getTime()) / 86400000); }

// 날짜 → 몇 일차 단어(1~160). 160일을 지나면 다시 1일차부터 복습 라운드.
function lessonOf(date){
  var start = ensureWordStart();
  var d = wDiff(date, start);
  if (d < 0) d = 0;
  return (d % WORD_TOTAL_DAYS) + 1;
}

function wordsOfLesson(n){
  var from = (n - 1) * WORDS_PER_DAY;
  return WORD_LIST.slice(from, from + WORDS_PER_DAY);
}
function wordsOfDate(date){ return wordsOfLesson(lessonOf(date)); }

function wordDay(date){
  ensureWordStart();
  var d = S.words.days[date];
  if (!d || typeof d !== 'object'){
    d = S.words.days[date] = { lesson: lessonOf(date), tries: {}, correct: {}, done: false, coin: false };
  }
  if (!d.tries || typeof d.tries !== 'object') d.tries = {};
  if (!d.correct || typeof d.correct !== 'object') d.correct = {};
  d.lesson = d.lesson || lessonOf(date);
  return d;
}

function wordCorrectCount(date){
  var d = S.words && S.words.days ? S.words.days[date] : null;
  if (!d || !d.correct) return 0;
  var n = 0;
  for (var k in d.correct) if (d.correct[k]) n++;
  return n;
}
function wordAllCorrect(date){
  var list = wordsOfDate(date), d = S.words.days[date];
  if (!d) return false;
  for (var i = 0; i < list.length; i++) if (!d.correct[i]) return false;
  return list.length > 0;
}

function normAns(s){
  return String(s == null ? '' : s).toLowerCase().replace(/[.!?,]/g, '').replace(/\s+/g, ' ').trim();
}
function checkAnswer(input, answer){
  var a = normAns(input), b = normAns(answer);
  return a !== '' && a === b;
}

// 5문제를 모두 맞히면 코인 +1 (그날 한 번만 · 기존 코인 장부에 함께 기록)
function awardWordCoin(date){
  var d = wordDay(date);
  if (d.coin) return false;
  if (date !== todayISO()) return false;
  for (var i = 0; i < S.ledger.length; i++){
    if (S.ledger[i].type === 'words' && S.ledger[i].dateKey === date){ d.coin = true; return false; }
  }
  d.coin = true;
  d.coinAt = stampNow();
  S.ledger.push({ id: uid(), at: stampNow(), type: 'words', amount: 1,
                  label: '오늘의 영단어 5개 완성', dateKey: date });
  return true;
}

function speakWord(word){
  if (!word) return;
  var text = String(word).replace(/[^A-Za-z' ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!text) return;
  try {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined'){
      toast('이 기기에서는 소리를 들을 수 없어요'); return;
    }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { toast('소리를 내지 못했어요'); }
}

function submitWordAnswer(){
  var date = wdate || todayISO();
  var list = wordsOfDate(date);
  var day = wordDay(date);
  var w = list[wi];
  if (!w) return;
  if (winput == null || !String(winput).trim()){ toast('답을 먼저 적어 주세요'); return; }
  if (checkAnswer(winput, w.answer)){
    day.correct[wi] = true;
    day.done = wordAllCorrect(date);
    wfeedback = { ok: true, msg: '정답! ' + w.answer + ' 🎉' };
    winput = '';
    if (day.done) awardWordCoin(date);
  } else {
    day.tries[wi] = (day.tries[wi] || 0) + 1;
    wfeedback = { ok: false, msg: '조금 달라요. 다시 해 봐요!' };
    wshake = true;
    wfocus = true;
  }
  render();
}

function viewWords(today){
  if (!wordsReady()){
    return '<section class="card"><div class="empty"><div class="kk" aria-hidden="true">' + kkyu('face') + '</div>' +
      '<p>단어장을 불러오지 못했어요.<br>인터넷을 확인하고 다시 열어 주세요.</p></div></section>';
  }
  ensureWordStart();
  if (!wdate) wdate = today;
  if (wdate > today) wdate = today;

  var date = wdate;
  var isToday = date === today;
  var lesson = lessonOf(date);
  var list = wordsOfLesson(lesson);
  wordDay(date);
  var done = wordCorrectCount(date);

  var head = '<section class="card" style="padding:15px 16px">' +
    '<div class="card-h" style="margin-bottom:9px"><div><h2>' + (isToday ? '오늘의 5단어' : '복습 · ' + mdOf(date)) + '</h2>' +
      '<p class="sub">' + (isToday ? lesson + '일차 / ' + WORD_TOTAL_DAYS + '일 · 매일 5개씩' : longDate(date) + '에 배운 단어') + '</p></div>' +
      (isToday ? '<span class="chip" style="pointer-events:none">' + done + '/5</span>'
               : '<button class="chip plain" data-act="wordToday">오늘로</button>') +
    '</div>' +
    '<div class="wbar"><i style="width:' + Math.round(done / list.length * 100) + '%"></i></div>' +
  '</section>';

  if (wmode === 'quiz') return head + wordQuizHTML(date, today);
  if (wmode === 'result') return head + wordResultHTML(date, today);
  return head + wordCardsHTML(date, today) + wordReviewHTML(today);
}

function wordQuizHTML(date, today){
  var list = wordsOfDate(date), day = wordDay(date);
  if (wi > list.length - 1) wi = list.length - 1;
  var w = list[wi];
  var answered = !!day.correct[wi];
  var tries = day.tries[wi] || 0;
  var sent = esc(w.example).replace('_____', '<span class="blank">_____</span>');
  var hint = HINT_TEXT[w.hint] || HINT_TEXT.base;
  var fb = '';
  if (answered){
    fb = '<div class="wfb ok">⭕ 정답! <b>' + esc(w.answer) + '</b> — ' + esc(w.meaning) + '</div>';
  } else if (wfeedback && !wfeedback.ok){
    fb = '<div class="wfb no">❌ ' + esc(wfeedback.msg) + '</div>';
  }
  var extra = '';
  if (answered){
    extra = '<p class="qko">' + esc(w.exampleKo) + '</p>';
  } else if (tries >= 2){
    extra = '<p class="qko">힌트: ' + normAns(w.answer).length + '글자이고, 첫 글자는 <b>' + esc(String(w.answer).charAt(0)) + '</b> 예요.</p>';
  }

  return '<section class="card">' +
    '<div class="card-h"><div><h2>빈칸 채우기</h2>' +
      '<p class="sub">문제 ' + (wi + 1) + ' / ' + list.length + ' · ' + wordCorrectCount(date) + '개 맞혔어요</p></div>' +
      '<span class="chip plain" style="pointer-events:none">' + (date === today ? '오늘' : '복습') + '</span></div>' +
    '<div class="qbox">' +
      '<p class="qen">' + sent + '</p>' +
      '<p class="qhint">💡 힌트: ' + hint + '</p>' +
      extra +
    '</div>' +
    (answered
      ? '<button class="btn mint" data-act="nextQ">' + (wi === list.length - 1 ? '결과 보기' : '다음 문제 →') + '</button>'
      : '<input class="input wans" id="wans" type="text" inputmode="text" autocomplete="off" autocorrect="off" ' +
          'autocapitalize="off" spellcheck="false" placeholder="빈칸에 들어갈 영어를 적어요" value="' + esc(winput) + '" maxlength="30">' +
        fb +
        '<button class="btn" style="margin-top:10px" data-act="submitAns">확인</button>') +
    '<button class="btn soft sm" style="margin-top:8px" data-act="backCards">카드로 돌아가기</button>' +
  '</section>';
}

function wordResultHTML(date, today){
  var list = wordsOfDate(date), day = wordDay(date);
  var first = 0;
  for (var i = 0; i < list.length; i++) if (day.correct[i] && !(day.tries[i])) first++;
  var isToday = date === today;
  var perfect = first === list.length;

  var out = '<section class="card">' +
    '<div class="empty" style="padding:6px 8px 2px"><div class="kk" aria-hidden="true">' + kkyu('cheer') + '</div>' +
      '<p style="font-size:15.5px;font-weight:800;color:#43395E;margin:10px 0 2px">' +
        (perfect ? '완벽해요! 한 번에 다 맞혔어요 🎉' : '5문제 모두 맞혔어요! 🎉') + '</p>' +
      '<p class="sub" style="margin-bottom:0">' + (isToday ? lessonOf(date) + '일차 완료 · ' + mdOf(date) : longDate(date) + ' 복습') + '</p></div>' +
    '<div class="wrecap">' + list.map(function(w, idx){
      var mark = day.correct[idx] ? ((day.tries[idx] || 0) > 0 ? '⭕' : '⭐') : '·';
      return '<div class="wrrow"><div class="wrt"><b>' + esc(w.word) + '</b><span>' + esc(w.meaning) + '</span></div>' +
        '<span class="wrok">' + mark + '</span></div>';
    }).join('') + '</div>';

  if (isToday){
    out += day.coin
      ? '<div class="banner ok" style="margin-top:14px">🪙 <span><b>코인 +1</b>을 받았어요! 뀨뀨가 코인을 가져왔어요.</span></div>'
      : '<div class="banner" style="margin-top:14px">🪙 <span>오늘 몫은 이미 받았어요. 내일 또 만나요!</span></div>';
  } else {
    out += '<div class="banner" style="margin-top:14px">📖 <span>복습이에요. 코인은 <b>오늘의 5단어</b>에서 받아요.</span></div>';
  }

  out += '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button class="btn ghost sm" data-act="backCards">카드로 보기</button>' +
      '<button class="btn sm mint" data-act="retryQuiz">한 번 더 풀기</button>' +
    '</div>' +
    '<p class="note" style="text-align:center">내일은 ' + (lessonOf(date) % WORD_TOTAL_DAYS + 1) + '일차 단어 5개가 기다려요!</p>' +
  '</section>';

}

function wordReviewHTML(today){
  var days = S.words && S.words.days ? S.words.days : {};
  var keys = Object.keys(days).filter(function(k){
    return k !== today && k <= todayISO() && wordCorrectCount(k) > 0;
  }).sort().reverse().slice(0, 8);
  if (!keys.length){
    return '<section class="card" style="padding:13px 16px"><p class="sub" style="margin:0">📚 하루 5개씩 160일이면 교육부 초등 영단어 800개를 모두 만나요. 오늘도 화이팅!</p></section>';
  }
  return '<section class="card">' +
    '<div class="card-h" style="margin-bottom:8px"><div><h2>지난 단어 복습</h2>' +
      '<p class="sub">배운 날의 5단어를 다시 외워 봐요</p></div></div>' +
    keys.map(function(k){
      var d = days[k];
      var lesson = d.lesson || lessonOf(k);
      var total = wordsOfLesson(lesson).length;
      return '<button class="wdrow" data-act="openReview" data-date="' + k + '">' +
        '<span class="wdbadge">' + lesson + '</span>' +
        '<span class="wdmain"><span class="wdt">' + longDate(k) + '</span>' +
        '<span class="wds">' + wordCorrectCount(k) + '/' + total + ' 맞힘' + (d.coin ? ' · 코인 +1' : '') + '</span></span>' +
        '<span class="wdact">복습</span></button>';
    }).join('') +
  '</section>';
}

    '<div class="lbl">직접 입력 (1 ~ ' + bal + '코인)</div>' +
    '<input class="input" id="rAmount" type="number" inputmode="numeric" min="1" max="' + bal + '" value="' + cur + '">' +
    '<div class="tip" style="margin-top:12px">🙋 부모님이 현금을 주신 뒤 아래 버튼을 눌러 주세요. ' +
      '사용한 코인은 바로 차감되고 내역에 기록돼요.</div>' +
    '<button class="btn mint" style="margin-top:14px" data-act="doRedeem">부모님 확인 · ' + '<span id="rBtnWon">' + won(cur * COIN_WON) + '</span> 받았어요</button>' +
    '<button class="btn soft sm" style="margin-top:8px" data-act="closeSheet">취소</button>';
}

/* ========================================================================
   동작
   ======================================================================== */
function onToggle(date, mid){
  var today = todayISO();
  var r = Logic.toggle(S, date, mid, today);
  if (!r) return;
  render();
  if (r.daily){
    if (r.weekly){
      fireConfetti(true);
      vibrate([30, 50, 30, 50, 80]);
      toast('🎉 일주일 개근! 뀨뀨가 보너스 +3코인까지 챙겨왔어요');
    } else {
      fireConfetti(false);
      vibrate(35);
      toast('⭐ 뀨뀨가 코인 +1을 가져왔어요!');
    }
  } else if (!r.checked && r.wasAwarded){
    toast('체크를 풀어도 이미 받은 코인은 그대로예요');
  }
}

function setPlanWeek(mon){
  planWeek = mon;
  var t = todayISO();
  planDay = (t >= mon && t <= addDays(mon, 6)) ? t : mon;
  draft = ''; render();
}

function addMission(explicitTitle){
  var input = document.getElementById('mTitle');
  var title = (typeof explicitTitle === 'string') ? explicitTitle : (input ? input.value : draft);
  var target = planWeek || mondayOf(todayISO());
  var day = (planDay && mondayOf(planDay) === target) ? planDay : target;
  var r = Logic.addMission(S, target, day, title, draftEmoji);
  if (!r.ok){ toast(r.msg); return; }
  draft = ''; draftEmoji = '⭐';
  render();
  var again = document.getElementById('mTitle');
  if (again) again.focus();
}

function delMission(mid){
  var target = planWeek || mondayOf(todayISO());
  var day = (planDay && mondayOf(planDay) === target) ? planDay : target;
  var w = ensureWeek(S, target);
  var m = dayList(w, day).filter(function(x){ return x.id === mid; })[0];
  if (!m) return;
  if (!window.confirm('"' + m.title + '" 미션을 ' + wdOf(day) + '요일에서 뺄까요?')) return;
  Logic.removeMission(S, target, day, mid, todayISO());
  render();
  toast('미션을 뺐어요');
}

function exportJSON(){
  try {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '뀨뀨미션-백업-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast('백업 파일을 내려받았어요');
  } catch (e) { toast('내보내기에 실패했어요'); }
}

function importJSON(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(String(reader.result));
      if (!data || typeof data !== 'object' || !data.weeks || !Array.isArray(data.ledger)){
        toast('백업 파일을 읽을 수 없어요'); return;
      }
      S = migrate(data);
      save(); render(); toast('백업을 불러왔어요');
    } catch (e) { toast('백업 파일을 읽을 수 없어요'); }
  };
  reader.readAsText(file);
}

function resetAll(){
  if (!window.confirm('모든 코인·미션·내역을 지우고 처음부터 시작할까요? 되돌릴 수 없어요.')) return;
  S = emptyState();
  sheet = null; cursor = null; planWeek = null; planDay = null;
  save(); render();
  toast('처음부터 다시 시작해요');
}

function openRedeem(){
  var bal = Logic.balance(S);
  if (bal < REDEEM_MIN){ toast(REDEEM_MIN + '코인부터 사용할 수 있어요'); return; }
  redeemInput = Math.min(REDEEM_MIN, bal);
  sheet = 'redeem';
  render();
}

function updateRedeemPreview(){
  var input = document.getElementById('rAmount');
  if (!input) return;
  var bal = Logic.balance(S);
  var v = Math.floor(Number(input.value));
  if (!v || v < 1) v = 1;
  if (v > bal) v = bal;
  redeemInput = v;
  var nc = document.getElementById('rCoins');
  var nw = document.getElementById('rWon');
  var nb = document.getElementById('rBtnWon');
  if (nc) nc.textContent = v + '코인';
  if (nw) nw.textContent = won(v * COIN_WON);
  if (nb) nb.textContent = won(v * COIN_WON);
}

function doRedeem(){
  var input = document.getElementById('rAmount');
  var v = input ? Math.floor(Number(input.value)) : redeemInput;
  var r = Logic.redeem(S, v, todayISO());
  if (!r.ok){ toast(r.msg); return; }
  sheet = null; redeemInput = null;
  render();
  fireConfetti(true);
  vibrate([20, 40, 20]);
  toast('🪙 ' + r.coins + '코인 사용 완료! ' + won(r.won) + '을 받았어요');
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;

  if (act === 'closeBg'){ if (ev.target === el){ sheet = null; render(); } return; }

  switch (act){
    case 'tab':
      view = el.dataset.view; sheet = null;
      if (view === 'words' && wmode !== 'quiz'){
        wdate = todayISO(); wmode = 'learn'; wi = 0; wflip = false; wfeedback = null; winput = '';
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
      render(); break;

    case 'pickDay':
      if (el.disabled) return;
      cursor = el.dataset.date; render(); break;

    case 'backToday':
      cursor = todayISO(); render(); break;

    case 'goDay':
      cursor = el.dataset.date; view = 'today'; render();
      window.scrollTo({ top: 0, behavior: 'auto' }); break;

    case 'toggle':
      onToggle(el.dataset.date, el.dataset.mid); break;

    case 'plan':
      sheet = 'plan';
      planWeek = el.dataset.week || (wdOf(todayISO()) === '일' ? addDays(mondayOf(todayISO()), 7) : mondayOf(todayISO()));
      planDay = (todayISO() >= planWeek && todayISO() <= addDays(planWeek, 6)) ? todayISO() : planWeek;
      draft = ''; render(); break;

    case 'pickPlanDay': {
      var curPD = document.getElementById('mTitle');
      if (curPD) draft = curPD.value;
      planDay = el.dataset.date; render();
      var fPD = document.getElementById('mTitle');
      if (fPD) fPD.focus();
      break;
    }

    case 'goPlanDay':
      sheet = 'plan';
      planWeek = mondayOf(el.dataset.date);
      planDay = el.dataset.date;
      draft = ''; render();
      window.scrollTo({ top: 0, behavior: 'auto' }); break;

    case 'copyFromLastWeekDay': {
      if (!planDay){ break; }
      var lwDay = addDays(planDay, -7), lwMon = mondayOf(lwDay);
      var lwW = S.weeks[lwMon];
      var srcLW = lwW ? dayList(lwW, lwDay) : [];
      if (!srcLW.length){ toast('지난 주 ' + wdOf(planDay) + '요일에 미션이 없어요'); break; }
      var dstLW = dayListRW(S, planWeek || mondayOf(planDay), planDay);
      if (dstLW.length && !window.confirm('지난 주 ' + wdOf(planDay) + '요일 미션 ' + srcLW.length + '개로 바꿔 쓸까요?')) break;
      dstLW.length = 0;
      srcLW.forEach(function(m){ dstLW.push({ id: uid(), title: m.title, emoji: m.emoji || '⭐' }); });
      render(); toast('지난 주 ' + wdOf(planDay) + '요일 미션 ' + srcLW.length + '개를 가져왔어요');
      break;
    }

    case 'copyDayToAll': {
      if (!planDay || !planWeek){ break; }
      var srcWA = ensureWeek(S, planWeek);
      var srcDA = dayList(srcWA, planDay);
      if (!srcDA.length){ toast('먼저 ' + wdOf(planDay) + '요일 미션을 정해 주세요'); break; }
      if (!window.confirm(wdOf(planDay) + '요일 미션 ' + srcDA.length + '개를 이번 주 다른 요일에도 똑같이 만들까요?')) break;
      weekDates(planWeek).forEach(function(d){
        if (d === planDay) return;
        var dst = dayListRW(S, planWeek, d);
        dst.length = 0;
        srcDA.forEach(function(m){ dst.push({ id: uid(), title: m.title, emoji: m.emoji || '⭐' }); });
      });
      render(); toast(wdOf(planDay) + '요일 미션을 이번 주 모든 요일에 복사했어요');
      break;
    }

    case 'planWeek':
      setPlanWeek(el.dataset.week); break;

    case 'pickEmoji':
      draftEmoji = el.dataset.emoji;
      var cur = document.getElementById('mTitle');
      if (cur) draft = cur.value;
      render();
      var f = document.getElementById('mTitle');
      if (f) f.focus();
      break;

    case 'addMission':
      addMission(); break;

    case 'quickAdd':
      draftEmoji = el.dataset.emoji || '⭐';
      addMission(el.dataset.title || ''); break;

    case 'copyLast': {
      var today0 = todayISO(), mon0 = mondayOf(today0), lastMon0 = addDays(mon0, -7);
      var lw0 = S.weeks[lastMon0];
      if (!lw0 || !weekHasMissions(lw0)){ toast('지난 주에 정한 미션이 없어요'); break; }
      var tw = ensureWeek(S, mon0);
      if (weekHasMissions(tw)){ toast('이번 주 미션이 이미 있어요'); break; }
      weekDates(mon0).forEach(function(d){
        var src = dayList(lw0, d);
        if (!src.length) return;
        var dst = dayListRW(S, mon0, d);
        dst.length = 0;
        src.forEach(function(m){ dst.push({ id: uid(), title: m.title, emoji: m.emoji || '⭐' }); });
      });
      tw.plannedAt = stampNow();
      render(); toast('지난 주 미션을 요일별로 그대로 가져왔어요');
      break;
    }

    case 'delMission':
      delMission(el.dataset.mid); break;

    /* ---------- 영단어 ---------- */
    case 'flip':
      wflip = !wflip; render(); break;

    case 'speak':
      speakWord((wordsOfDate(wdate || todayISO())[wi] || {}).word); break;

    case 'prevCard':
      if (wi > 0){ wi--; wflip = false; render(); }
      break;

    case 'nextCard':
      if (wi < wordsOfDate(wdate || todayISO()).length - 1){ wi++; wflip = false; render(); }
      break;

    case 'gotoCard':
      wi = Math.max(0, Math.min(WORDS_PER_DAY - 1, parseInt(el.dataset.i, 10) || 0));
      wflip = false; render(); break;

    case 'startQuiz':
      wmode = 'quiz'; wi = 0; winput = ''; wfeedback = null; wfocus = true; wflip = false;
      render(); break;

    case 'submitAns':
      submitWordAnswer(); break;

    case 'nextQ': {
      var wl = wordsOfDate(wdate || todayISO());
      if (wi < wl.length - 1){ wi++; winput = ''; wfeedback = null; wmode = 'quiz'; wfocus = true; }
      else { wmode = 'result'; }
      render(); break;
    }

    case 'backCards':
      wmode = 'learn'; wflip = false; wfeedback = null; winput = ''; render(); break;

    case 'retryQuiz': {
      var wd2 = wordDay(wdate || todayISO());
      wd2.correct = {}; wd2.tries = {};
      wmode = 'quiz'; wi = 0; winput = ''; wfeedback = null; wfocus = true; render(); break;
    }

    case 'openReview':
      wdate = el.dataset.date; wmode = 'learn'; wi = 0; wflip = false;
      wfeedback = null; winput = ''; render();
      window.scrollTo({ top: 0, behavior: 'auto' }); break;

    case 'wordToday':
      wdate = todayISO(); wmode = 'learn'; wi = 0; wflip = false;
      wfeedback = null; winput = ''; render(); break;

    case 'settings':
      sheet = 'settings'; render(); break;

    case 'closeSheet':
      sheet = null; draft = ''; render(); break;

    case 'openRedeem':
      openRedeem(); break;

    case 'setCoins':
      var inp = document.getElementById('rAmount');
      if (inp){ inp.value = el.dataset.coins; updateRedeemPreview(); }
      break;

    case 'doRedeem':
      doRedeem(); break;

    case 'export':
      exportJSON(); break;

    case 'import':
      var fi = document.getElementById('importFile');
      if (fi) fi.click();
      break;

    case 'reset':
      resetAll(); break;
  }
});

document.addEventListener('input', function(ev){
  var t = ev.target;
  if (!t) return;
  if (t.id === 'mTitle'){ draft = t.value; return; }
  if (t.id === 'wans'){ winput = t.value; return; }
  if (t.id === 'kidNameInput'){ S.childName = t.value.slice(0, 12); save();
    var b = document.getElementById('bsub');
    if (b) b.textContent = (S.childName || '').trim() ? S.childName + '의 미션 · 매일 모두 끝내면 코인 1개!' : '뀨뀨와 매일 미션을 모두 끝내면 코인 1개!';
    return; }
  if (t.id === 'rAmount'){ updateRedeemPreview(); return; }
});

document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t && t.id === 'importFile' && t.files && t.files[0]) importJSON(t.files[0]);
});

document.addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'mTitle'){
    ev.preventDefault(); addMission();
  }
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'wans'){
    ev.preventDefault(); submitWordAnswer();
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.dataset && ev.target.dataset.act === 'flip'){
    ev.preventDefault(); wflip = !wflip; render();
  }
});

/* ---------- 시작 ---------- */
render();

/* 테스트/디버그 훅 (화면에는 없음) */
window.__kmc = {
  Logic: Logic,
  state: function(){ return S; },
  today: todayISO,
  render: render,
  setDate: function(iso){ __testDate = iso; cursor = null; render(); },
  setView: function(v){ view = v; render(); },
  reset: function(){ S = emptyState(); cursor = null; planWeek = null; planDay = null; sheet = null; words_reset(); save(); render(); },
  words: {
    all: function(){ return WORD_LIST; },
    lessonOf: lessonOf,
    ofDate: wordsOfDate,
    day: wordDay,
    correctCount: wordCorrectCount,
    award: awardWordCoin,
    submit: submitWordAnswer,
    check: checkAnswer,
    hint: function(k){ return HINT_TEXT[k]; },
    state: function(){ return { wmode: wmode, wdate: wdate, wi: wi, wflip: wflip, input: winput }; },
    go: function(mode, date){ wmode = mode || 'learn'; wdate = date || null; wi = 0; wflip = false; winput = ''; wfeedback = null; render(); },
    type: function(v){ var e = document.getElementById('wans'); if (e){ e.value = v; winput = v; } return winput; },
    setInput: function(v){ winput = v; },
    startAt: function(i){ wi = i; wmode = 'quiz'; wfocus = true; render(); }
  }
};

function words_reset(){ S.words = { start: '', days: {} }; wmode = 'learn'; wdate = null; wi = 0; wflip = false; winput = ''; wfeedback = null; }
})();
</script>
